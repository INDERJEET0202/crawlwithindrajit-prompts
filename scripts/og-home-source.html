<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0a0a0c; }
  .wrap { position: relative; width: 1200px; height: 630px; padding: 64px 72px; color: #f3f1ee; font-family: Inter, sans-serif;
    background: radial-gradient(700px 420px at 92% 110%, rgba(255,46,136,.35), transparent 65%), radial-gradient(600px 360px at 0% 0%, rgba(255,90,31,.16), transparent 60%), #0a0a0c; }
  .sun { position: absolute; right: -70px; top: 70px; width: 480px; height: 480px; border-radius: 50%;
    background: linear-gradient(180deg, #ffc23d 0%, #ff5a1f 45%, #ff2e88 100%);
    -webkit-mask: repeating-linear-gradient(180deg, #000 0 26px, transparent 26px 36px); opacity: .9; }
  .grid { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; opacity: .55;
    background: repeating-linear-gradient(90deg, rgba(255,90,31,.5) 0 1px, transparent 1px 90px), repeating-linear-gradient(0deg, rgba(255,46,136,.45) 0 1px, transparent 1px 34px);
    transform: perspective(380px) rotateX(58deg); transform-origin: bottom; -webkit-mask: linear-gradient(0deg, #000 20%, transparent); }
  .logo { position: relative; font-family: Anton; font-size: 34px; letter-spacing: .04em; display: flex; align-items: center; gap: 14px; }
  .logo span { color: #ff5a1f; }
  .logo small { font: 500 14px 'JetBrains Mono'; letter-spacing: .16em; color: #9a98a3; border: 1px solid #2c2c36; border-radius: 6px; padding: 5px 10px; }
  h1 { position: relative; font-family: Anton; font-weight: 400; text-transform: uppercase; font-size: 104px; line-height: .95; margin-top: 56px; max-width: 780px; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #ffc23d, #ff5a1f, #ff2e88); -webkit-background-clip: text; color: transparent; }
  .tags { position: relative; display: flex; gap: 12px; margin-top: 40px; }
  .tags span { font: 600 20px Inter; padding: 10px 18px; border-radius: 999px; border: 1px solid #34343f; background: rgba(10,10,12,.7); }
  .handle { position: absolute; left: 72px; bottom: 52px; font: 500 20px 'JetBrains Mono'; letter-spacing: .08em; color: #c9c6cf; }
</style></head>
<body><div class="wrap">
  <div class="sun"></div><div class="grid"></div>
  <div class="logo"><b style="font-weight:400">CRAWLWITH<span>INDRAJIT</span></b><small>PROMPTS</small></div>
  <h1>AI prompts for<br><em>riders &amp; creators</em></h1>
  <div class="tags"><span>Free prompts</span><span>Reel kits</span><span>Claude skills</span></div>
  <div class="handle">@crawlwithindrajit</div>
</div></body></html>
